name: HAFALATI Gold Final Complet
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build Final Gold
        run: |
          flutter create . --org com.hafalati.app --project-name hafalati --platforms android --overwrite
          cat > pubspec.yaml << 'ENDPUB'
          name: hafalati
          description: HAFALATI Gold Black Complet - Registration + Admin
          publish_to: 'none'
          version: 11.0.0+700
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            provider: ^6.1.1
            url_launcher: ^6.2.4
            image_picker: ^1.0.7
            video_player: ^2.8.2
            cupertino_icons: ^1.0.6
          flutter:
            uses-material-design: true
          ENDPUB
          mkdir -p lib
          cat > lib/main.dart << 'ENDMAIN'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:provider/provider.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:video_player/video_player.dart';
          import 'package:url_launcher/url_launcher.dart';
          const gold = Color(0xFFD4AF37);
          const goldLight = Color(0xFFFFD700);
          const blackBg = Color(0xFF0A0A0A);
          const blackCard = Color(0xFF1A1A1A);

          class AppState extends ChangeNotifier {
            List<Map<String, dynamic>> pending = [];
            List<Map<String, dynamic>> approved = [
              {'name':'أوركسترا سفيان','type':'الأوركسترات','city':'بني ملال','phone':'hidden','videos':[{'path':null,'title':'عرس بني ملال'}]},
              {'name':'النكافة حسنة','type':'النكافة','city':'بني ملال','phone':'hidden','videos':[{'path':null,'title':'لبسة عروسة'}]},
            ];
            List<Map<String, dynamic>> clients = [];
            void addPending(Map<String, dynamic> f){ 
              final idx = approved.indexWhere((e)=> e['name']==f['name'] && e['type']==f['type']);
              if(idx!=-1){ approved[idx]['videos'].addAll(f['videos']); notifyListeners(); return; }
              pending.add(f); notifyListeners(); 
            }
            void addClient(Map<String, dynamic> c){ clients.add(c); notifyListeners(); }
            void approve(int i){ approved.add(pending[i]); pending.removeAt(i); notifyListeners(); }
            void reject(int i){ pending.removeAt(i); notifyListeners(); }
          }

          void main()=> runApp(const MyApp());
          class MyApp extends StatelessWidget{ const MyApp({super.key}); @override Widget build(BuildContext c){ return ChangeNotifierProvider(create: (_)=> AppState(), child: MaterialApp(debugShowCheckedModeBanner:false, theme: ThemeData(scaffoldBackgroundColor: blackBg, fontFamily: 'Cairo'), home: const Splash())); } }

          // SPLASH ذهبي وأسود
          class Splash extends StatefulWidget{ const Splash({super.key}); @override State<Splash> createState()=> _SplashS(); }
          class _SplashS extends State<Splash>{
            @override void initState(){ super.initState(); Future.delayed(const Duration(seconds:2), ()=> Navigator.pushReplacement(context, MaterialPageRoute(builder: (_)=> const HomeGold()))); }
            @override Widget build(BuildContext context){
              return Scaffold(backgroundColor: blackBg, body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[
                Container(width:110, height:110, decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: gold, width:2), color: blackCard), child: const Center(child: Text('H', style: TextStyle(color: gold, fontSize:60, fontWeight: FontWeight.bold)))),
                const SizedBox(height:16),
                const Text('HAFALATI', style: TextStyle(color: gold, fontSize:32, fontWeight: FontWeight.bold, letterSpacing:3)),
                const SizedBox(height:6),
                const Text('بني ملال و النواحي', style: TextStyle(color: Colors.white54, fontSize:12)),
                const SizedBox(height:20),
                const SizedBox(width:30, height:30, child: CircularProgressIndicator(color: gold, strokeWidth:3)),
              ])));
            }
          }

          // HOME ذهبي وأسود - بحال التصويرة
          class HomeGold extends StatelessWidget{
            const HomeGold({super.key});
            @override Widget build(BuildContext context){
              return Scaffold(backgroundColor: blackBg,
                body: SafeArea(child: SingleChildScrollView(padding: const EdgeInsets.all(18), child: Column(children:[
                  const SizedBox(height:10),
                  Row(mainAxisAlignment: MainAxisAlignment.center, children:[Container(padding: const EdgeInsets.all(8), decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: gold)), child: const Icon(Icons.music_note, color: gold, size:22)), const SizedBox(width:8), const Text('HAFALATI', style: TextStyle(color: gold, fontSize:28, fontWeight: FontWeight.bold, letterSpacing:2))]),
                  const SizedBox(height:4),
                  const Text('Marketplace des orchestres • سوق الفرق الموسيقية', style: TextStyle(color: gold, fontSize:10)),
                  const SizedBox(height:28),
                  const Align(alignment: Alignment.centerRight, child: Text('مرحباً! كيف تريد الانضمام ؟', style: TextStyle(color: Colors.white, fontSize:20, fontWeight: FontWeight.bold))),
                  const SizedBox(height:4),
                  const Align(alignment: Alignment.centerRight, child: Text('اختر دورك للمتابعة | Choisissez votre profil', style: TextStyle(color: Colors.white54, fontSize:11))),
                  const SizedBox(height:22),

                  // كارت فرقة
                  _goldCard(context, icon: Icons.music_note, title:'سجل كفرقة موسيقية', sub:'Créer un compte orchestre', desc:'أنضم كفرقة موسيقية • عرض فيديواتك • خانة خاصة بك', onTap: ()=> Navigator.push(context, MaterialPageRoute(builder: (_)=> const TypesGold()))),

                  const SizedBox(height:16),

                  // كارت زبون
                  _goldCard(context, icon: Icons.people, title:'سجل كزبون - باغي عرس', sub:'Je veux un mariage', desc:'سجل كزبون • شوف الفيديوات بحال فيسبوك • خانة خاصة بك', isClient:true, onTap: ()=> Navigator.push(context, MaterialPageRoute(builder: (_)=> const RegisterClient()))),

                  const SizedBox(height:30),
                  const Text('لديك حساب بالفعل؟', style: TextStyle(color: Colors.white54, fontSize:12)),
                  const SizedBox(height:8),
                  Row(mainAxisAlignment: MainAxisAlignment.center, children:[
                    GestureDetector(onTap: ()=> Navigator.push(context, MaterialPageRoute(builder: (_)=> const LoginClient())), child: const Text('تسجيل الدخول كزبون', style: TextStyle(color: gold, fontSize:11))),
                    const Text('  |  ', style: TextStyle(color: Colors.white24)),
                    GestureDetector(onTap: ()=> Navigator.push(context, MaterialPageRoute(builder: (_)=> const LoginAdmin())), child: const Text('Admin 0704246107', style: TextStyle(color: gold, decoration: TextDecoration.underline, fontSize:11))),
                  ]),
                  const SizedBox(height:20),
                  const Text('بالمتابعة أنت توافق على الشروط وسياسة الخصوصية', textAlign: TextAlign.center, style: TextStyle(color: Colors.white24, fontSize:9)),
                ]))),
              );
            }
            Widget _goldCard(BuildContext ctx, {required IconData icon, required String title, required String sub, required String desc, bool isClient=false, required VoidCallback onTap}){
              return GestureDetector(onTap: onTap, child: Container(padding: const EdgeInsets.all(14), decoration: BoxDecoration(color: blackCard, borderRadius: BorderRadius.circular(16), border: Border.all(color: gold.withOpacity(0.6), width:1.2), boxShadow:[BoxShadow(color: gold.withOpacity(0.12), blurRadius:10)]), child: Row(children:[
                Container(width:64, height:64, decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: gold, width:1.2), color: blackBg), child: Icon(icon, color: gold, size:30)),
                const SizedBox(width:12),
                Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[
                  Text(title, style: const TextStyle(color: Colors.white, fontSize:14, fontWeight: FontWeight.bold)),
                  const SizedBox(height:2),
                  Text(sub, style: const TextStyle(color: goldLight, fontSize:10)),
                  const SizedBox(height:4),
                  Text(desc, style: const TextStyle(color: Colors.white38, fontSize:9)),
                ])),
                const Icon(Icons.arrow_forward_ios, color: gold, size:14),
              ])));
            }
          }

          // أنواع الفرق - ذهبي وأسود
          class TypesGold extends StatelessWidget{
            const TypesGold({super.key});
            @override Widget build(BuildContext context){
              final types = [
                {'t':'المصورين','i':Icons.camera_alt},
                {'t':'قاعات الأعراس','i':Icons.meeting_room},
                {'t':'الأوركسترات','i':Icons.music_note},
                {'t':'الدقايقية و عيساوة','i':Icons.self_improvement},
                {'t':'التريتور','i':Icons.restaurant},
                {'t':'النكافة','i':Icons.face_retouching_natural},
              ];
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: const Text('اختار نوع فرقتك - خانة خاصة بك', style: TextStyle(color: gold, fontSize:13))),
                body: GridView.builder(padding: const EdgeInsets.all(14), gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount:2, crossAxisSpacing:12, mainAxisSpacing:12, childAspectRatio:1.1), itemCount: types.length, itemBuilder: (c,i){ final tt=types[i]; return GestureDetector(onTap: ()=> Navigator.push(c, MaterialPageRoute(builder: (_)=> RegisterFerqaGold(type: tt['t'] as String))), child: Container(decoration: BoxDecoration(color: blackCard, borderRadius: BorderRadius.circular(16), border: Border.all(color: gold.withOpacity(0.4))), child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[Icon(tt['i'] as IconData, color: gold, size:36), const SizedBox(height:10), Text(tt['t'] as String, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize:12)), const SizedBox(height:4), const Text('خانة خاصة - سجل معلوماتك', style: TextStyle(color: gold, fontSize:8))]))); }),
              );
            }
          }

          // تسجيل فرقة - خانة خاصة بها - ذهبي وأسود
          class RegisterFerqaGold extends StatefulWidget{ final String type; const RegisterFerqaGold({super.key, required this.type}); @override State<RegisterFerqaGold> createState()=> _RFG(); }
          class _RFG extends State<RegisterFerqaGold>{
            final name=TextEditingController(); final city=TextEditingController(); final phone=TextEditingController(); final desc=TextEditingController();
            XFile? vid;
            Future<void> pick() async { final v=await ImagePicker().pickVideo(source: ImageSource.gallery); if(v!=null) setState(()=> vid=v); }
            @override Widget build(BuildContext context){
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: Text('خانة ${widget.type} - سجل معلوماتك', style: const TextStyle(color: gold, fontSize:12))),
                body: SingleChildScrollView(padding: const EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[
                  Container(padding: const EdgeInsets.all(10), decoration: BoxDecoration(color: gold.withOpacity(0.08), borderRadius: BorderRadius.circular(10), border: Border.all(color: gold.withOpacity(0.3))), child: const Row(children:[Icon(Icons.info, color: gold, size:16), SizedBox(width:6), Expanded(child: Text('هادي الخانة ديالك - عمر معلوماتك - الفيديو فقط كيبان للزبائن - النمرة مخفية عند الوسيط 0704246107', style: TextStyle(color: gold, fontSize:10)))]) ),
                  const SizedBox(height:14),
                  _field(name, 'اسم الفرقة * - مثلا: أوركسترا سفيان / النكافة حسنة'),
                  const SizedBox(height:10),
                  _field(city, 'المدينة * - بني ملال - قصبة تادلة - الفقيه بن صالح...'),
                  const SizedBox(height:10),
                  _field(phone, 'رقم الواتساب ديالك * - مخفي - غير الوسيط كيشوفو - 06...'),
                  const SizedBox(height:10),
                  _field(desc, 'وصف خدمتك - مثلا: كنخدم أعراس فخمة - 10 سنوات خبرة', max:3),
                  const SizedBox(height:14),
                  GestureDetector(onTap: pick, child: Container(width: double.infinity, height:140, decoration: BoxDecoration(color: blackCard, borderRadius: BorderRadius.circular(12), border: Border.all(color: gold, width:1)), child: vid==null ? const Column(mainAxisAlignment: MainAxisAlignment.center, children:[Icon(Icons.video_call, color: gold, size:44), SizedBox(height:6), Text('اضغط هنا لرفع فيديو من هاتفك نيشان', style: TextStyle(color: Colors.white70, fontSize:11)), Text('بحال واتساب - ماشي رابط', style: TextStyle(color: Colors.white38, fontSize:9))]) : Column(mainAxisAlignment: MainAxisAlignment.center, children:[const Icon(Icons.check_circle, color: Colors.greenAccent, size:44), const SizedBox(height:6), Text('✅ ${vid!.name}', style: const TextStyle(color: Colors.greenAccent, fontSize:11))]))),
                  const SizedBox(height:18),
                  SizedBox(width: double.infinity, height:52, child: ElevatedButton(onPressed: (){
                    if(name.text.isEmpty || city.text.isEmpty || phone.text.isEmpty){ ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('عمر كل الخانات'), backgroundColor: Colors.red)); return; }
                    if(vid==null){ ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('اختار فيديو'), backgroundColor: Colors.red)); return; }
                    context.read<AppState>().addPending({'name':name.text, 'type':widget.type, 'city':city.text, 'phone':phone.text, 'desc':desc.text, 'videos':[{'path':vid!.path,'title':vid!.name}]});
                    ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تم التسجيل - خانة خاصة بك - في انتظار قبول الوسيط 0704246107'), backgroundColor: Colors.green));
                    Navigator.pop(context); Navigator.pop(context);
                  }, style: ElevatedButton.styleFrom(backgroundColor: gold, foregroundColor: Colors.black, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12))), child: const Text('سجل - إرسال للوسيط للموافقة', style: TextStyle(fontWeight: FontWeight.bold)))),
                  const SizedBox(height:8),
                  const Center(child: Text('بعد الموافقة - غادي تولي عندك بروفايل خاص فيه فيديواتك كاملين', style: TextStyle(color: Colors.white24, fontSize:9))),
                ])),
              );
            }
            Widget _field(TextEditingController c, String label, {int max=1}){ return TextField(controller: c, maxLines: max, style: const TextStyle(color: Colors.white, fontSize:13), decoration: InputDecoration(labelText: label, labelStyle: const TextStyle(color: gold, fontSize:11), enabledBorder: OutlineInputBorder(borderSide: const BorderSide(color: gold), borderRadius: BorderRadius.circular(10)), focusedBorder: OutlineInputBorder(borderSide: const BorderSide(color: goldLight, width:1.5), borderRadius: BorderRadius.circular(10)), contentPadding: const EdgeInsets.all(12))); }
          }

          // تسجيل زبون - خانة خاصة به
          class RegisterClient extends StatefulWidget{ const RegisterClient({super.key}); @override State<RegisterClient> createState()=> _RC(); }
          class _RC extends State<RegisterClient>{
            final name=TextEditingController(); final city=TextEditingController(); final phone=TextEditingController();
            @override Widget build(BuildContext context){
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: const Text('خانة الزبون - سجل كزبون', style: TextStyle(color: gold, fontSize:13))),
                body: SingleChildScrollView(padding: const EdgeInsets.all(16), child: Column(children:[
                  Container(padding: const EdgeInsets.all(10), decoration: BoxDecoration(color: gold.withOpacity(0.08), borderRadius: BorderRadius.circular(10), border: Border.all(color: gold.withOpacity(0.3))), child: const Row(children:[Icon(Icons.person, color: gold, size:16), SizedBox(width:6), Expanded(child: Text('هادي الخانة ديالك كزبون - عمر معلوماتك - باش الوسيط يتواصل معاك', style: TextStyle(color: gold, fontSize:10)))]) ),
                  const SizedBox(height:14),
                  _f(name, 'اسمك الكامل *'),
                  const SizedBox(height:10),
                  _f(city, 'مدينتك * - بني ملال...'),
                  const SizedBox(height:10),
                  _f(phone, 'رقم الواتساب ديالك * - 06...'),
                  const SizedBox(height:20),
                  SizedBox(width: double.infinity, height:52, child: ElevatedButton(onPressed: (){
                    if(name.text.isEmpty || phone.text.isEmpty){ ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('عمر الخانات'), backgroundColor: Colors.red)); return; }
                    context.read<AppState>().addClient({'name':name.text, 'city':city.text, 'phone':phone.text});
                    ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تم تسجيلك كزبون - دابا تقدر تشوف الفيديوات'), backgroundColor: Colors.green));
                    Navigator.pushReplacement(context, MaterialPageRoute(builder: (_)=> const ClientCategory()));
                  }, style: ElevatedButton.styleFrom(backgroundColor: gold, foregroundColor: Colors.black), child: const Text('سجل كزبون - دخول', style: TextStyle(fontWeight: FontWeight.bold)))),
                ])),
              );
            }
            Widget _f(TextEditingController c, String l){ return TextField(controller: c, style: const TextStyle(color: Colors.white), decoration: InputDecoration(labelText: l, labelStyle: const TextStyle(color: gold, fontSize:11), enabledBorder: OutlineInputBorder(borderSide: const BorderSide(color: gold), borderRadius: BorderRadius.circular(10)))); }
          }

          class LoginClient extends StatelessWidget{
            const LoginClient({super.key});
            @override Widget build(BuildContext context){
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: const Text('دخول زبون', style: TextStyle(color: gold)) ),
                body: Padding(padding: const EdgeInsets.all(16), child: Column(children:[
                  const SizedBox(height:20),
                  const Icon(Icons.person, color: gold, size:60),
                  const SizedBox(height:20),
                  const TextField(style: TextStyle(color: Colors.white), decoration: InputDecoration(labelText: 'رقم الواتساب', labelStyle: TextStyle(color: gold), enabledBorder: OutlineInputBorder(borderSide: BorderSide(color: gold)))),
                  const SizedBox(height:20),
                  SizedBox(width: double.infinity, height:50, child: ElevatedButton(onPressed: ()=> Navigator.push(context, MaterialPageRoute(builder: (_)=> const ClientCategory())), style: ElevatedButton.styleFrom(backgroundColor: gold), child: const Text('دخول', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)))),
                ])),
              );
            }
          }

          // زبون - كيشوف الكاتيغوري والفرق بفيديواتهم
          class ClientCategory extends StatelessWidget{
            const ClientCategory({super.key});
            @override Widget build(BuildContext context){
              final cats = [
                {'t':'الأوركسترات','i':Icons.music_note},
                {'t':'النكافة','i':Icons.face_retouching_natural},
                {'t':'المصورين','i':Icons.camera_alt},
                {'t':'قاعات الأعراس','i':Icons.meeting_room},
                {'t':'الدقايقية و عيساوة','i':Icons.self_improvement},
                {'t':'التريتور','i':Icons.restaurant},
              ];
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: const Text('اختار نوع الفرقة - شوف الفيديوات بحال يوتيوب', style: TextStyle(color: gold, fontSize:11))),
                body: GridView.builder(padding: const EdgeInsets.all(12), gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount:2, childAspectRatio:1.1), itemCount: cats.length, itemBuilder: (c,i){ final cat=cats[i]; return GestureDetector(onTap: ()=> Navigator.push(c, MaterialPageRoute(builder: (_)=> CategoryFeed(type: cat['t'] as String))), child: Container(margin: const EdgeInsets.all(6), decoration: BoxDecoration(color: blackCard, borderRadius: BorderRadius.circular(14), border: Border.all(color: gold.withOpacity(0.4))), child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[Icon(cat['i'] as IconData, color: gold, size:32), const SizedBox(height:8), Text(cat['t'] as String, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize:12)), const Text('شوف الفرق + فيديوات', style: TextStyle(color: gold, fontSize:9))]))); }),
              );
            }
          }

          class CategoryFeed extends StatelessWidget{
            final String type; const CategoryFeed({super.key, required this.type});
            @override Widget build(BuildContext context){
              final all=context.watch<AppState>().approved.where((e)=> e['type']==type).toList();
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: Text(type, style: const TextStyle(color: gold)) ),
                body: all.isEmpty ? const Center(child: Text('ما كاين حتى فرقة مقبولة - سيري للأدمن', style: TextStyle(color: Colors.white38))) : ListView.builder(padding: const EdgeInsets.all(10), itemCount: all.length, itemBuilder: (c,i){ final f=all[i]; return GestureDetector(onTap: ()=> Navigator.push(c, MaterialPageRoute(builder: (_)=> FerqaProfileGold(ferqa: f))), child: Container(margin: const EdgeInsets.only(bottom:12), decoration: BoxDecoration(color: blackCard, borderRadius: BorderRadius.circular(14), border: Border.all(color: gold.withOpacity(0.3))), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[
                  ListTile(leading: Container(width:44, height:44, decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: gold)), child: const Icon(Icons.person, color: gold)), title: Text(f['name'], style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize:13)), subtitle: Text('${f['city']} - ${f['videos'].length} فيديو', style: const TextStyle(color: Colors.white54, fontSize:10))),
                  Container(height:160, color: Colors.black, child: const Center(child: Icon(Icons.play_circle_fill, color: gold, size:50))),
                  Padding(padding: const EdgeInsets.all(10), child: Row(children:[Expanded(child: Text(f['videos'][0]['title'], style: const TextStyle(color: Colors.white, fontSize:11))), const Icon(Icons.arrow_forward_ios, color: gold, size:12)])),
                ]))); }),
              );
            }
          }

          class FerqaProfileGold extends StatelessWidget{
            final Map<String, dynamic> ferqa; const FerqaProfileGold({super.key, required this.ferqa});
            @override Widget build(BuildContext context){
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: Text(ferqa['name'], style: const TextStyle(color: gold, fontSize:13)) ),
