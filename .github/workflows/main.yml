                Row(children:[Expanded(child: ElevatedButton(onPressed: pickVideo, style: ElevatedButton.styleFrom(backgroundColor:black), child: const Text('Video', style: TextStyle(color:white, fontSize:11)))), const SizedBox(width:8), Expanded(child: ElevatedButton(onPressed: addSched, style: ElevatedButton.styleFrom(backgroundColor:white, side: const BorderSide(color:black)), child: const Text('Jadwal', style: TextStyle(color:black, fontSize:11))))]),
                const SizedBox(height:12),
                ...vids.map((v){ return Container(margin: const EdgeInsets.only(bottom:6), padding: const EdgeInsets.all(8), decoration: BoxDecoration(color:bg, borderRadius: BorderRadius.circular(6)), child: Text(v.toString().split('/').last, style: const TextStyle(fontSize:11)) ); }).toList(),
                ...sched.map((s){ return Container(margin: const EdgeInsets.only(bottom:6), padding: const EdgeInsets.all(8), decoration: BoxDecoration(border: Border.all(color:border), borderRadius: BorderRadius.circular(6)), child: Text('${s['date']} - ${s['price']} - ${s['status']}', style: const TextStyle(fontSize:11)) ); }).toList(),
              ]));
            }
          }
          ENDMAIN
      - name: Get deps
        run: flutter pub get
      - name: Build APK All In One
        run: flutter build apk --release
      - name: Upload APK All In One
        uses: actions/upload-artifact@v4
        with:
          name: HAFALATI-FINAL-ALL-IN-ONE-NO-TEXT
          path: build/app/outputs/flutter-apk/app-release.apk
