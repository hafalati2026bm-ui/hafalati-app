name: HAFALATI TIKTOK DARK FINAL
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build TikTok Final
        run: |
          flutter create . --org com.hafalati.app --project-name hafalati --platforms android --overwrite
          cat > pubspec.yaml << 'ENDPUB'
          name: hafalati
          description: HAFALATI TikTok Dark Final
          publish_to: 'none'
          version: 10.0.0+100
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            provider: ^6.1.1
            url_launcher: ^6.2.4
            shared_preferences: ^2.2.2
            image_picker: ^1.0.7
            cupertino_icons: ^1.0.6
          flutter:
            uses-material-design: true
          ENDPUB
          mkdir -p lib
          # lib/main.dart is already in repo - keep your file
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAFALATI-TIKTOK-DARK-FINAL-ALL-IN-ONE
          path: build/app/outputs/flutter-apk/app-release.apk
