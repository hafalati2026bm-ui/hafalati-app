              final p = await SharedPreferences.getInstance();
              try {
                pending = (jsonDecode(p.getString('pending') ?? '[]') as List).cast<Map<String, dynamic>>();
                approved = (jsonDecode(p.getString('approved') ?? '[]') as List).cast<Map<String, dynamic>>();
                bookings = (jsonDecode(p.getString('bookings') ?? '[]') as List).cast<Map<String, dynamic>>();
              } catch(e){ pending=[]; approved=[]; bookings=[]; }
              if(approved.isEmpty && pending.isEmpty){
                approved=[{'name':'Orchestre Soufiane','user':'orchestre_soufiane','city':'Beni Mellal','price':'15000 MAD','type':'Orchestre','bio':'Orchestre pro mariage - Chaabi','musiciens':'7 musiciens','rating':'4.9','avis':'24','videos':[{'path':'','title':'Demo Beni Mellal'}],'schedule':[{'date':'20 Déc 2026','price':'15000 MAD','status':'Disponible'}]}];
                await save();
              }
              notifyListeners();
