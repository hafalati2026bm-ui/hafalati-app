name: HAFALATI Clean Form
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build Clean
        run: |
          flutter create . --org com.hafalati.app --project-name hafalati --platforms android --overwrite
          cat > pubspec.yaml << 'ENDPUB'
          name: hafalati
          description: HAFALATI Clean
          publish_to: 'none'
          version: 13.0.0+900
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            provider: ^6.1.1
            url_launcher: ^6.2.4
            image_picker: ^1.0.7
            video_player: ^2.8.2
            cupertino_icons: ^1.0.6
          flutter:
            uses-material-design: true
          ENDPUB
          mkdir -p lib
          cat > lib/main.dart << 'ENDMAIN'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:provider/provider.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:video_player/video_player.dart';
          import 'package:url_launcher/url_launcher.dart';
          const gold = Color(0xFFD4AF37);
          const blackBg = Color(0xFF0A0A0A);
          const blackCard = Color(0xFF1A1A1A);
          class AppState extends ChangeNotifier {
            List<Map<String, dynamic>> pending = [];
            List<Map<String, dynamic>> approved = [
              {'name':'أوركسترا سفيان','type':'الأوركسترات','city':'بني ملال','videos':[{'path':null,'title':'عرس'}]},
            ];
            void addPending(Map<String, dynamic> f){ pending.add(f); notifyListeners(); }
            void approve(int i){ approved.add(pending[i]); pending.removeAt(i); notifyListeners(); }
            void reject(int i){ pending.removeAt(i); notifyListeners(); }
          }
          void main()=> runApp(const MyApp());
          class MyApp extends StatelessWidget{ const MyApp({super.key}); @override Widget build(BuildContext c){ return ChangeNotifierProvider(create: (_)=> AppState(), child: MaterialApp(debugShowCheckedModeBanner:false, home: const HomeGold())); } }
          class HomeGold extends StatefulWidget{ const HomeGold({super.key}); @override State<HomeGold> createState()=> _HG(); }
          class _HG extends State<HomeGold>{
            int secretTap=0;
            @override Widget build(BuildContext context){
              return Scaffold(backgroundColor: blackBg,
                body: SafeArea(child: Padding(padding: const EdgeInsets.all(18), child: Column(children:[
                  const SizedBox(height:20),
                  GestureDetector(onTap: (){ secretTap++; if(secretTap>=5){ secretTap=0; Navigator.push(context, MaterialPageRoute(builder: (_)=> const LoginAdminSecret())); } }, child: const Text('HAFALATI', style: TextStyle(color: gold, fontSize:30, fontWeight: FontWeight.bold, letterSpacing:2))),
                  const SizedBox(height:40),
                  _card(context, Icons.music_note, 'سجل كفرقة', ()=> Navigator.push(context, MaterialPageRoute(builder: (_)=> const TypesGold()))),
                  const SizedBox(height:14),
                  _card(context, Icons.person, 'سجل كزبون', ()=> Navigator.push(context, MaterialPageRoute(builder: (_)=> const ClientCategory()))),
                ]))),
              );
            }
            Widget _card(BuildContext ctx, IconData icon, String t, VoidCallback onTap){ return GestureDetector(onTap: onTap, child: Container(height:72, decoration: BoxDecoration(color: blackCard, borderRadius: BorderRadius.circular(16), border: Border.all(color: gold.withOpacity(0.5))), child: Row(children:[const SizedBox(width:16), Container(width:48, height:48, decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: gold)), child: Icon(icon, color: gold)), const SizedBox(width:14), Text(t, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)), const Spacer(), const Icon(Icons.arrow_forward_ios, color: gold, size:14), const SizedBox(width:16)]))); }
          }
          class TypesGold extends StatelessWidget{
            const TypesGold({super.key});
            @override Widget build(BuildContext context){
              final types=['المصورين','قاعات الأعراس','الأوركسترات','الدقايقية و عيساوة','التريتور','النكافة'];
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: const Text('اختار نوعك', style: TextStyle(color: gold))),
                body: GridView.builder(padding: const EdgeInsets.all(14), gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount:2, childAspectRatio:1.15), itemCount: types.length, itemBuilder: (c,i){ return GestureDetector(onTap: ()=> Navigator.push(c, MaterialPageRoute(builder: (_)=> RegisterClean(type: types[i]))), child: Container(margin: const EdgeInsets.all(6), decoration: BoxDecoration(color: blackCard, borderRadius: BorderRadius.circular(16), border: Border.all(color: gold.withOpacity(0.3))), child: Center(child: Text(types[i], style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold))))); }),
              );
            }
          }
          // فورم نقي بلا هضرة بزاف
          class RegisterClean extends StatefulWidget{ final String type; const RegisterClean({super.key, required this.type}); @override State<RegisterClean> createState()=> _RC(); }
          class _RC extends State<RegisterClean>{
            final name=TextEditingController(); final city=TextEditingController(); final phone=TextEditingController();
            XFile? vid;
            Future<void> pick() async { final v=await ImagePicker().pickVideo(source: ImageSource.gallery); if(v!=null) setState(()=> vid=v); }
            @override Widget build(BuildContext context){
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: Text(widget.type, style: const TextStyle(color: gold, fontSize:14))),
                body: Padding(padding: const EdgeInsets.all(20), child: Column(children:[
                  const SizedBox(height:10),
                  TextField(controller: name, style: const TextStyle(color: Colors.white), decoration: InputDecoration(hintText: 'الاسم', hintStyle: const TextStyle(color: Colors.white38), prefixIcon: const Icon(Icons.person, color: gold, size:20), filled: true, fillColor: blackCard, enabledBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide(color: gold.withOpacity(0.3))), focusedBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: const BorderSide(color: gold)))) ,
                  const SizedBox(height:14),
                  TextField(controller: city, style: const TextStyle(color: Colors.white), decoration: InputDecoration(hintText: 'المدينة', hintStyle: const TextStyle(color: Colors.white38), prefixIcon: const Icon(Icons.location_on, color: gold, size:20), filled: true, fillColor: blackCard, enabledBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide(color: gold.withOpacity(0.3))), focusedBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: const BorderSide(color: gold)))) ,
                  const SizedBox(height:14),
                  TextField(controller: phone, keyboardType: TextInputType.phone, style: const TextStyle(color: Colors.white), decoration: InputDecoration(hintText: 'الهاتف', hintStyle: const TextStyle(color: Colors.white38), prefixIcon: const Icon(Icons.phone, color: gold, size:20), filled: true, fillColor: blackCard, enabledBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide(color: gold.withOpacity(0.3))), focusedBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: const BorderSide(color: gold)))) ,
                  const SizedBox(height:20),
                  GestureDetector(onTap: pick, child: Container(width: double.infinity, height:110, decoration: BoxDecoration(color: blackCard, borderRadius: BorderRadius.circular(12), border: Border.all(color: gold.withOpacity(0.4))), child: vid==null ? const Column(mainAxisAlignment: MainAxisAlignment.center, children:[Icon(Icons.videocam, color: gold, size:32), SizedBox(height:6), Icon(Icons.add, color: Colors.white38, size:18)]) : Column(mainAxisAlignment: MainAxisAlignment.center, children:[const Icon(Icons.check_circle, color: Colors.green, size:32), const SizedBox(height:6), Text(vid!.name, style: const TextStyle(color: Colors.green, fontSize:10), maxLines:1)]))),
                  const Spacer(),
                  SizedBox(width: double.infinity, height:52, child: ElevatedButton(onPressed: (){ if(name.text.isEmpty) return; if(vid==null){ ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('اختار فيديو'))); return; } context.read<AppState>().addPending({'name':name.text, 'type':widget.type, 'city':city.text, 'phone':phone.text, 'videos':[{'path':vid!.path,'title':vid!.name}]}); Navigator.pop(context); Navigator.pop(context); ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تم'), backgroundColor: Colors.green)); }, style: ElevatedButton.styleFrom(backgroundColor: gold, foregroundColor: Colors.black, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12))), child: const Text('تسجيل', style: TextStyle(fontWeight: FontWeight.bold, fontSize:16)))),
                  const SizedBox(height:10),
                ])),
              );
            }
          }
          class ClientCategory extends StatelessWidget{
            const ClientCategory({super.key});
            @override Widget build(BuildContext context){
              final cats=['الأوركسترات','النكافة','المصورين','قاعات الأعراس','الدقايقية و عيساوة','التريتور'];
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: const Text('اختار', style: TextStyle(color: gold))),
                body: GridView.builder(padding: const EdgeInsets.all(12), gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount:2), itemCount: cats.length, itemBuilder: (c,i){ return GestureDetector(onTap: ()=> Navigator.push(c, MaterialPageRoute(builder: (_)=> CategoryFeed(type: cats[i]))), child: Container(margin: const EdgeInsets.all(6), decoration: BoxDecoration(color: blackCard, borderRadius: BorderRadius.circular(12), border: Border.all(color: gold.withOpacity(0.3))), child: Center(child: Text(cats[i], style: const TextStyle(color: Colors.white))))); }),
              );
            }
          }
          class CategoryFeed extends StatelessWidget{
            final String type; const CategoryFeed({super.key, required this.type});
            @override Widget build(BuildContext context){
              final all=context.watch<AppState>().approved.where((e)=> e['type']==type).toList();
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: Text(type, style: const TextStyle(color: gold)) ),
                body: ListView.builder(padding: const EdgeInsets.all(10), itemCount: all.length, itemBuilder: (c,i){ final f=all[i]; return GestureDetector(onTap: ()=> Navigator.push(c, MaterialPageRoute(builder: (_)=> FerqaProfile(ferqa: f))), child: Container(margin: const EdgeInsets.only(bottom:10), decoration: BoxDecoration(color: blackCard, borderRadius: BorderRadius.circular(12), border: Border.all(color: gold.withOpacity(0.3))), child: ListTile(leading: const Icon(Icons.play_circle, color: gold), title: Text(f['name'], style: const TextStyle(color: Colors.white)), subtitle: Text(f['city'], style: const TextStyle(color: Colors.white54))))); }),
              );
            }
          }
          class FerqaProfile extends StatelessWidget{
            final Map<String, dynamic> ferqa; const FerqaProfile({super.key, required this.ferqa});
            @override Widget build(BuildContext context){
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: Text(ferqa['name'], style: const TextStyle(color: gold)) ),
                body: Column(children:[
                  Expanded(child: GridView.builder(padding: const EdgeInsets.all(10), gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount:2, childAspectRatio:0.8), itemCount: ferqa['videos'].length, itemBuilder: (c,i){ final v=ferqa['videos'][i]; return GestureDetector(onTap: ()=> Navigator.push(c, MaterialPageRoute(builder: (_)=> VideoPage(video: v, ferqa: ferqa))), child: Container(margin: const EdgeInsets.all(4), decoration: BoxDecoration(color: blackCard, borderRadius: BorderRadius.circular(12), border: Border.all(color: gold.withOpacity(0.3))), child: Column(children:[Expanded(child: Container(color: Colors.black, child: const Center(child: Icon(Icons.play_circle_fill, color: gold, size:40)))), Padding(padding: const EdgeInsets.all(6), child: Text(v['title'], style: const TextStyle(color: Colors.white, fontSize:9)))]))); })),
                  Padding(padding: const EdgeInsets.all(12), child: SizedBox(width: double.infinity, height:50, child: ElevatedButton.icon(onPressed: () async { final u=Uri.parse('https://wa.me/212704246107?text=${Uri.encodeComponent('بغيت ${ferqa['name']}')}'); await launchUrl(u, mode: LaunchMode.externalApplication); }, icon: const Icon(Icons.chat), label: const Text('تواصل واتساب'), style: ElevatedButton.styleFrom(backgroundColor: gold, foregroundColor: Colors.black)))),
                ]),
              );
            }
          }
          class VideoPage extends StatefulWidget{ final Map<String, dynamic> video; final Map<String, dynamic> ferqa; const VideoPage({super.key, required this.video, required this.ferqa}); @override State<VideoPage> createState()=> _VP(); }
          class _VP extends State<VideoPage>{ VideoPlayerController? con; @override void initState(){ super.initState(); final p=widget.video['path']; if(p!=null && File(p).existsSync()){ con=VideoPlayerController.file(File(p))..initialize().then((_)=> setState((){ con!.play(); con!.setLooping(true); })); } } @override void dispose(){ con?.dispose(); super.dispose(); } @override Widget build(BuildContext context){ return Scaffold(backgroundColor: Colors.black, body: Stack(children:[Center(child: con!=null && con!.value.isInitialized ? AspectRatio(aspectRatio: con!.value.aspectRatio, child: VideoPlayer(con!)) : const Icon(Icons.video_library, color: gold, size:60)), Positioned(top:36, left:8, child: IconButton(icon: const Icon(Icons.arrow_back, color: Colors.white), onPressed: ()=> Navigator.pop(context))), Positioned(left:12, right:12, bottom:20, child: ElevatedButton.icon(onPressed: () async { final u=Uri.parse('https://wa.me/212704246107?text=${Uri.encodeComponent('بغيت ${widget.ferqa['name']}')}'); await launchUrl(u, mode: LaunchMode.externalApplication); }, icon: const Icon(Icons.chat), label: const Text('تواصل واتساب'), style: ElevatedButton.styleFrom(backgroundColor: gold, foregroundColor: Colors.black)))])); } }
          class LoginAdminSecret extends StatefulWidget{ const LoginAdminSecret({super.key}); @override State<LoginAdminSecret> createState()=> _LAS(); }
          class _LAS extends State<LoginAdminSecret>{
            final pass=TextEditingController(); bool obscure=true;
            @override Widget build(BuildContext context){
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: const Text('دخول', style: TextStyle(color: gold, fontSize:13))),
                body: Padding(padding: const EdgeInsets.all(20), child: Column(children:[
                  const SizedBox(height:30),
                  Container(width:80, height:80, decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: gold, width:2)), child: const Icon(Icons.lock, color: gold, size:40)),
                  const SizedBox(height:20),
                  TextField(controller: pass, obscureText: obscure, style: const TextStyle(color: Colors.white), decoration: InputDecoration(hintText: '••••', prefixIcon: const Icon(Icons.lock, color: gold), suffixIcon: IconButton(icon: Icon(obscure?Icons.visibility_off:Icons.visibility, color: gold), onPressed: ()=> setState(()=> obscure=!obscure)), filled: true, fillColor: blackCard, enabledBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide(color: gold.withOpacity(0.3))), focusedBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: const BorderSide(color: gold)))),
                  const SizedBox(height:20),
                  SizedBox(width: double.infinity, height:50, child: ElevatedButton(onPressed: (){ if(pass.text.trim()=='hafalati2026'){ Navigator.pushReplacement(context, MaterialPageRoute(builder: (_)=> const AdminGold())); } else { ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('خطأ'), backgroundColor: Colors.red)); } }, style: ElevatedButton.styleFrom(backgroundColor: gold, foregroundColor: Colors.black), child: const Text('دخول'))),
                ])),
              );
            }
          }
          class AdminGold extends StatelessWidget{
            const AdminGold({super.key});
            @override Widget build(BuildContext context){
              final st=context.watch<AppState>();
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackCard, iconTheme: const IconThemeData(color: gold), title: Text('الطلبات (${st.pending.length})', style: const TextStyle(color: gold))),
                body: st.pending.isEmpty ? const Center(child: Text('لا يوجد', style: TextStyle(color: Colors.white24))) : ListView.builder(padding: const EdgeInsets.all(12), itemCount: st.pending.length, itemBuilder: (c,i){ final f=st.pending[i]; return Container(margin: const EdgeInsets.only(bottom:10), padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: blackCard, borderRadius: BorderRadius.circular(12), border: Border.all(color: gold.withOpacity(0.4))), child: Row(children:[Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text(f['name'], style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)), Text('${f['type']} - ${f['city']}', style: const TextStyle(color: Colors.white54, fontSize:11))])), IconButton(icon: const Icon(Icons.check_circle, color: Colors.green, size:28), onPressed: ()=> context.read<AppState>().approve(i)), IconButton(icon: const Icon(Icons.cancel, color: Colors.red, size:28), onPressed: ()=> context.read<AppState>().reject(i))])); }),
              );
            }
          }
          ENDMAIN
          cat > android/app/google-services.json << 'ENDJSON'
          {"project_info":{"project_number":"1","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:dummy","android_client_info":{"package_name":"com.hafalati.app"}},"api_key":[{"current_key":"dummy"}]}]}
          ENDJSON
      - name: Get deps
        run: flutter pub get
      - name: Build Clean APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hafalati-clean-form-apk
          path: build/app/outputs/flutter-apk/app-release.apk
