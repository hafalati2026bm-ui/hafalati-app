                const SizedBox(height:12),
                SizedBox(width: double.infinity, height:54, child: ElevatedButton(onPressed: ()=> Navigator.push(c, MaterialPageRoute(builder: (_)=> const ChooseType())), style: ElevatedButton.styleFrom(backgroundColor:const Color(0xFF1DBF73), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12))), child: const Text('Selling services', style: TextStyle(color:white, fontWeight: FontWeight.bold)))),
                const SizedBox(height:20),
              ]))));
            }
          }
