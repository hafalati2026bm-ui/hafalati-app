                ...vids.map((v){ return Container(margin: const EdgeInsets.only(top:6), padding: const EdgeInsets.all(10), decoration: BoxDecoration(color:bg, borderRadius: BorderRadius.circular(8)), child: Text(v.toString(), style: const TextStyle(color:black, fontSize:12))); }).toList(),
                const SizedBox(height:12),
                Text('${sched.length} dates - prix fixes par vous', style: const TextStyle(color:black, fontWeight: FontWeight.bold, fontSize:12)),
                ...sched.map((s){ return Container(margin: const EdgeInsets.only(top:6), padding: const EdgeInsets.all(10), decoration: BoxDecoration(color:white, borderRadius: BorderRadius.circular(8), border: Border.all(color:borderGrey)), child: Text('${s['date']} - ${s['price']} - ${s['status']}', style: const TextStyle(color:black, fontSize:12))); }).toList(),
              ]));
            }
          }
          ENDMAIN
      - name: Get deps
        run: flutter pub get
      - name: Build APK Fixed
        run: flutter build apk --release
      - name: Upload APK Fixed OK
        uses: actions/upload-artifact@v4
        with:
          name: HAFALATI-STEP1-FIXED-BUILD-OK
          path: build/app/outputs/flutter-apk/app-release.apk
