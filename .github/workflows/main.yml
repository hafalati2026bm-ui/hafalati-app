              if(approved.isEmpty && pending.isEmpty){
                approved=[{'name':'Orchestre Soufiane','user':'orchestre_soufiane','city':'Beni Mellal','price':'15000 MAD','type':'Orchestre','bio':'Orchestre pro mariage Chaabi','musiciens':'7 musiciens','videos':['Demo Beni Mellal'],'schedule':[{'date':'20 Dec 2026','price':'15000 MAD','status':'Disponible'}]}];
                await save();
