                realCard(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Row(children:[CircleAvatar(backgroundColor:bg, child: Text(ferqa['name'][0])), SizedBox(width:10), Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text(ferqa['name'], style: TextStyle(color:black, fontWeight: FontWeight.bold)), Text('${ferqa['city']} - ${ferqa['price']} - Votre prix', style: TextStyle(color:greyText, fontSize:11))])]), SizedBox(height:10), Row(children:[Expanded(child: ElevatedButton.icon(onPressed: pick, icon: Icon(Icons.videocam, size:16, color:white), label: Text('Publier vidéo', style: TextStyle(color:white, fontSize:11)), style: ElevatedButton.styleFrom(backgroundColor:Colors.red))), SizedBox(width:8), Expanded(child: ElevatedButton(onPressed: addSched, style: ElevatedButton.styleFrom(backgroundColor:black), child: Text('Ajouter date', style: TextStyle(color:white, fontSize:11))))])])),
                SizedBox(height:12),
                Text('${vids.length} vidéos - comme YouTube (tap long pour supprimer)', style: TextStyle(color:black, fontWeight: FontWeight.bold, fontSize:12)),
                ...vids.map((v){ return Container(margin: EdgeInsets.only(top:6), padding: EdgeInsets.all(10), decoration: BoxDecoration(color:bg, borderRadius: BorderRadius.circular(8)), child: Text(v['title']??'Vidéo', style: TextStyle(color:black, fontSize:12))); }).toList(),
                SizedBox(height:12),
                Text('${sched.length} dates - prix fixés par vous', style: TextStyle(color:black, fontWeight: FontWeight.bold, fontSize:12)),
                ...sched.map((s){ return Container(margin: EdgeInsets.only(top:6), padding: EdgeInsets.all(10), decoration: BoxDecoration(color:white, borderRadius: BorderRadius.circular(8), border: Border.all(color:borderGrey)), child: Text('${s['date']} - ${s['price']} - ${s['status']}', style: TextStyle(color:black, fontSize:12))); }).toList(),
              ]));
            }
          }
