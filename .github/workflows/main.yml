name: HAFALATI FINAL ALL IN ONE NO TEXT
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build Final All In One
        run: |
          flutter create . --org com.hafalati.app --project-name hafalati --platforms android --overwrite
          cat > pubspec.yaml << 'ENDPUB'
          name: hafalati
          description: HAFALATI Final All In One
          publish_to: 'none'
          version: 9.0.0+90
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            provider: ^6.1.1
            url_launcher: ^6.2.4
            shared_preferences: ^2.2.2
            image_picker: ^1.0.7
            cupertino_icons: ^1.0.6
          flutter:
            uses-material-design: true
          ENDPUB
          mkdir -p lib
          cat > lib/main.dart << 'ENDMAIN'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:provider/provider.dart';
          import 'package:url_launcher/url_launcher.dart';
