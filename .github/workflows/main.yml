      - name: 1. Generate KEYSTORE Auto No PC + Gold H Icon
        run: |
          pip install pillow
          python3 << 'PY'
          from PIL import Image, ImageDraw
          import os, shutil
          # أيقونة H ذهبية
          for size, folder in [(72,"mipmap-mdpi"),(96,"mipmap-hdpi"),(144,"mipmap-xhdpi"),(192,"mipmap-xxhdpi"),(192,"mipmap-xxxhdpi")]:
              img = Image.new('RGBA', (size, size), (0,0,0,255))
              draw = ImageDraw.Draw(img)
              gold=(212,175,55)
              # H كبير
              w,h=size,size
              # نرسم H باليد باش يبان مزيان
              bar_w = w//8
              draw.rectangle([w*0.2, h*0.15, w*0.2+bar_w, h*0.85], fill=gold)
              draw.rectangle([w*0.8-bar_w, h*0.15, w*0.8, h*0.85], fill=gold)
              draw.rectangle([w*0.2, h*0.5-h//20, w*0.8, h*0.5+h//20], fill=gold)
              os.makedirs(f"android/app/src/main/res/{folder}", exist_ok=True)
              img.save(f"android/app/src/main/res/{folder}/ic_launcher.png")
          # Icon 512 for Play Store
          img512 = Image.new('RGBA', (512,512), (0,0,0,255))
          draw = ImageDraw.Draw(img512)
          gold=(212,175,55)
          draw.rectangle([512*0.2, 512*0.15, 512*0.2+512//8, 512*0.85], fill=gold)
          draw.rectangle([512*0.8-512//8, 512*0.15, 512*0.8, 512*0.85], fill=gold)
          draw.rectangle([512*0.2, 512*0.5-25, 512*0.8, 512*0.5+25], fill=gold)
          img512.save("icon-512-playstore.png")
          # Feature Graphic 1024x500
          feat = Image.new('RGB', (1024,500), (0,0,0))
          d=ImageDraw.Draw(feat)
          d.rectangle([380,100,430,400], fill=gold)
          d.rectangle([600,100,650,400], fill=gold)
          d.rectangle([380,225,650,275], fill=gold)
          d.text((700,200), "HAFALATI", fill=(255,255,255))
          feat.save("feature-graphic-1024x500.png")
          print("Icons Gold H Created")
          PY
          # المفتاح - يتولد بوحدو بلا PC
          if [ ! -f hafalati.jks ]; then
