name: HAFALATI FIX CRASH 100%
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix Crash Build
        run: |
          flutter create . --org com.hafalati.app --project-name hafalati --platforms android --overwrite
          cat > pubspec.yaml << 'ENDPUB'
          name: hafalati
          description: HAFALATI Fixed
          publish_to: 'none'
          version: 24.0.0+2000
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            provider: ^6.1.1
            url_launcher: ^6.2.4
            image_picker: ^1.0.7
            shared_preferences: ^2.2.2
            cupertino_icons: ^1.0.6
          flutter:
            uses-material-design: true
          ENDPUB
          mkdir -p lib
          cat > lib/main.dart << 'ENDMAIN'
          import 'package:flutter/material.dart';
          import 'package:provider/provider.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          const gold = Color(0xFFD4AF37);
          const blackBg = Color(0xFF000000);
          const instaGrey = Color(0xFF262626);
          const blackCard = Color(0xFF121212);
          const adminWhatsApp = "212704246107";
          class AppState extends ChangeNotifier {
            List<Map<String, dynamic>> pending = [];
            List<Map<String, dynamic>> approved = [{'name':'أوركسترا سفيان','user':'group_soufiane','type':'الأوركسترات','city':'بني ملال','bio':'أوركسترا','videos':[], 'schedule':[]}];
            List<Map<String, dynamic>> bookings = []; List<Map<String, dynamic>> clients = [];
            void addPending(Map<String, dynamic> f){ pending.add(f); notifyListeners(); }
            void addClient(Map<String, dynamic> c){ clients.add(c); notifyListeners(); }
            void addBooking(Map<String, dynamic> b){ bookings.add(b); notifyListeners(); }
            void approve(int i){ approved.add(pending[i]); pending.removeAt(i); notifyListeners(); }
            void reject(int i){ pending.removeAt(i); notifyListeners(); }
            void addVideo(String user, Map<String, dynamic> v){ for(var f in approved){ if(f['user']==user){ f['videos'].insert(0, v); notifyListeners(); return; } } }
            void addSchedule(String user, Map<String, dynamic> s){ for(var f in approved){ if(f['user']==user){ f['schedule'].add(s); notifyListeners(); return; } } }
            void delVideo(String user, int i){ for(var f in approved){ if(f['user']==user){ f['videos'].removeAt(i); notifyListeners(); return; } } }
            void delSchedule(String user, int i){ for(var f in approved){ if(f['user']==user){ f['schedule'].removeAt(i); notifyListeners(); return; } } }
            int getIdx(String user){ for(int i=0;i<approved.length;i++){ if(approved[i]['user']==user) return i; } return -1; }
          }
          void main()=> runApp(const MyApp());
          class MyApp extends StatelessWidget{ const MyApp({super.key}); @override Widget build(BuildContext c){ return ChangeNotifierProvider(create: (_)=> AppState(), child: MaterialApp(debugShowCheckedModeBanner:false, theme: ThemeData.dark(), home: const Splash())); } }
          class Splash extends StatefulWidget{ const Splash({super.key}); @override State<Splash> createState()=> _Sp(); }
          class _Sp extends State<Splash>{
            @override void initState(){ super.initState(); _check(); }
            Future<void> _check() async { final p=await SharedPreferences.getInstance(); final ferqa=p.getString('ferqa'); final cPhone=p.getString('cPhone'); final cName=p.getString('cName'); await Future.delayed(const Duration(milliseconds:700)); if(!mounted) return; if(ferqa!=null) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_)=> FerqaPage(user: ferqa))); else if(cPhone!=null) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_)=> Home(clientName: cName??'', clientPhone: cPhone))); else Navigator.pushReplacement(context, MaterialPageRoute(builder: (_)=> const Home(clientName: '', clientPhone: ''))); }
            @override Widget build(BuildContext context){ return const Scaffold(backgroundColor: blackBg, body: Center(child: Text('HAFALATI', style: TextStyle(color: gold, fontSize:28, fontWeight: FontWeight.bold)))); }
          }
          class Home extends StatefulWidget{ final String clientName; final String clientPhone; const Home({super.key, required this.clientName, required this.clientPhone}); @override State<Home> createState()=> _Ho(); }
          class _Ho extends State<Home>{
            int secret=0; int idx=0;
            @override Widget build(BuildContext context){
              final st=context.watch<AppState>();
              return Scaffold(backgroundColor: blackBg, body: idx==0? _feed(st): idx==1? _search(st): idx==2? _add(): idx==3? _myBookings(st): _me(), bottomNavigationBar: BottomNavigationBar(backgroundColor: blackBg, selectedItemColor: Colors.white, unselectedItemColor: Colors.white38, type: BottomNavigationBarType.fixed, currentIndex: idx, onTap: (i)=> setState(()=> idx=i), items: const [BottomNavigationBarItem(icon: Icon(Icons.home_filled), label: ''), BottomNavigationBarItem(icon: Icon(Icons.search), label: ''), BottomNavigationBarItem(icon: Icon(Icons.add_box_outlined), label: ''), BottomNavigationBarItem(icon: Icon(Icons.bookmark_border), label: ''), BottomNavigationBarItem(icon: Icon(Icons.person), label: '')]));
            }
            Widget _feed(AppState st){
              List all=[]; for(var f in st.approved){ for(var v in f['videos']){ all.add({'ferqa':f,'video':v}); } }
              return SafeArea(child: Column(children:[
                Padding(padding: const EdgeInsets.all(12), child: Row(children:[GestureDetector(onTap: (){ secret++; if(secret>=5){ secret=0; Navigator.push(context, MaterialPageRoute(builder: (_)=> const LoginAdmin())); } }, child: const Text('HAFALATI', style: TextStyle(color: Colors.white, fontSize:20, fontWeight: FontWeight.bold))), const Spacer(), const Icon(Icons.send, color: Colors.white)])),
                Expanded(child: all.isEmpty? const Center(child: Text('ما كاين حتى فيديو - الفرق غادي تبدا تلوح', style: TextStyle(color: Colors.white24, fontSize:12))) : ListView.builder(itemCount: all.length, itemBuilder: (c,i){
                  final ferqa=all[i]['ferqa']; final video=all[i]['video'];
                  return Column(crossAxisAlignment: CrossAxisAlignment.start, children:[
                    ListTile(leading: CircleAvatar(backgroundColor: blackCard, child: Text(ferqa['name'][0], style: const TextStyle(color: Colors.white, fontSize:12))), title: Text(ferqa['user'], style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize:13)), subtitle: Text('${ferqa['city']} - ${ferqa['type']}', style: const TextStyle(color: Colors.white54, fontSize:10))),
                    Container(height:380, color: blackCard, child: const Center(child: Icon(Icons.play_circle_fill, color: Colors.white70, size:60))),
                    Padding(padding: const EdgeInsets.all(10), child: Row(children:[const Icon(Icons.favorite_border, color: Colors.white, size:22), const Spacer(), GestureDetector(onTap: ()=> _book(ferqa), child: Container(padding: const EdgeInsets.symmetric(horizontal:12, vertical:5), decoration: BoxDecoration(color: const Color(0xFF25D366), borderRadius: BorderRadius.circular(6)), child: const Text('للحجز والاستفسار - واتساب 0704246107', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize:11))))])),
                    Padding(padding: const EdgeInsets.symmetric(horizontal:12), child: Text(video['title'], style: const TextStyle(color: Colors.white, fontSize:12))),
                    const SizedBox(height:12),
                  ]);
                })),
              ]));
            }
            Widget _search(AppState st){ return SafeArea(child: GridView.builder(padding: const EdgeInsets.all(2), gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount:3, crossAxisSpacing:1, mainAxisSpacing:1), itemCount: st.approved.length, itemBuilder: (c,i){ final f=st.approved[i]; return Container(color: blackCard, child: Center(child: Text('${f['videos'].length} فيديو', style: const TextStyle(color: Colors.white, fontSize:10)))); })); }
            Widget _add(){ return SafeArea(child: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[const Icon(Icons.video_library, color: gold, size:50), const SizedBox(height:12), const Text('سجل كفرقة - مرة وحدة وتبقى داخل', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize:12)), const SizedBox(height:16), ElevatedButton(onPressed: ()=> Navigator.push(context, MaterialPageRoute(builder: (_)=> const Types())), style: ElevatedButton.styleFrom(backgroundColor: gold, foregroundColor: Colors.black), child: const Text('سجل كفرقة')), const SizedBox(height:8), ElevatedButton(onPressed: ()=> Navigator.push(context, MaterialPageRoute(builder: (_)=> const FerqaLogin())), style: ElevatedButton.styleFrom(backgroundColor: Colors.white, foregroundColor: Colors.black), child: const Text('دخولي كفرقة'))]))); }
            Widget _myBookings(AppState st){
              if(widget.clientPhone.isEmpty){
                final n=TextEditingController(); final p=TextEditingController();
                return SafeArea(child: Padding(padding: const EdgeInsets.all(20), child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[const Text('دخول كزبون - مرة وحدة وتبقى داخل', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize:12)), const SizedBox(height:12), TextField(controller: n, style: const TextStyle(color: Colors.white), decoration: InputDecoration(hintText: 'اسمك', filled: true, fillColor: instaGrey, border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none))), const SizedBox(height:8), TextField(controller: p, style: const TextStyle(color: Colors.white), decoration: InputDecoration(hintText: 'واتساب', filled: true, fillColor: instaGrey, border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none))), const SizedBox(height:12), SizedBox(width: double.infinity, child: ElevatedButton(onPressed: () async { if(n.text.isEmpty||p.text.isEmpty) return; final pref=await SharedPreferences.getInstance(); await pref.setString('cPhone', p.text.trim()); await pref.setString('cName', n.text.trim()); context.read<AppState>().addClient({'name':n.text.trim(),'phone':p.text.trim()}); if(!mounted) return; Navigator.pushReplacement(context, MaterialPageRoute(builder: (_)=> Home(clientName: n.text.trim(), clientPhone: p.text.trim()))); }, style: ElevatedButton.styleFrom(backgroundColor: Colors.white, foregroundColor: Colors.black), child: const Text('دخول')))])));
              }
              return SafeArea(child: Center(child: Text('حجوزات ${widget.clientName}', style: const TextStyle(color: Colors.white))));
            }
            Widget _me(){ return SafeArea(child: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[Text(widget.clientName.isEmpty? 'زائر' : widget.clientName, style: const TextStyle(color: Colors.white)), const SizedBox(height:10), ElevatedButton(onPressed: ()=> Navigator.push(context, MaterialPageRoute(builder: (_)=> const FerqaLogin())), child: const Text('دخولي كفرقة'))]))); }
            void _book(Map<String, dynamic> ferqa){
              showModalBottomSheet(context: context, backgroundColor: blackCard, shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(16))), builder: (ctx){
                return Padding(padding: const EdgeInsets.all(20), child: Column(mainAxisSize: MainAxisSize.min, children:[
                  Container(width:40, height:4, decoration: BoxDecoration(color: Colors.white24, borderRadius: BorderRadius.circular(2))),
                  const SizedBox(height:20),
                  const Icon(Icons.chat, color: Color(0xFF25D366), size:50),
                  const SizedBox(height:12),
                  const Text('للحجز والاستفسار', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize:18)),
                  const SizedBox(height:6),
                  const Text('المرجو التواصل عبر الواتساب', style: TextStyle(color: Colors.white70, fontSize:14)),
                  const SizedBox(height:16),
                  Container(padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: instaGrey, borderRadius: BorderRadius.circular(8)), child: Row(mainAxisAlignment: MainAxisAlignment.center, children:[const Icon(Icons.phone, color: Color(0xFF25D366), size:18), const SizedBox(width:8), Text('0704246107 - ${ferqa['name']}', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize:13))])),
                  const SizedBox(height:20),
                  SizedBox(width: double.infinity, height:50, child: ElevatedButton.icon(onPressed: () async {
                    final msg='سلام الوسيط HAFALATI بغيت نحجز ${ferqa['name']}';
                    final url=Uri.parse('https://wa.me/$adminWhatsApp?text=${Uri.encodeComponent(msg)}');
                    final booking={'clientName': widget.clientName.isEmpty? 'زبون' : widget.clientName, 'clientPhone': widget.clientPhone, 'ferqaName': ferqa['name'], 'ferqaUser': ferqa['user'], 'ferqaType': ferqa['type'], 'date': 'عبر واتساب', 'status':'عند الوسيط'};
                    context.read<AppState>().addBooking(booking);
                    await launchUrl(url, mode: LaunchMode.externalApplication);
                    if(context.mounted) Navigator.pop(ctx);
                  }, icon: const Icon(Icons.chat, color: Colors.white), label: const Text('تواصل عبر الواتساب - 0704246107', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize:13)), style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF25D366)))),
                ]));
              });
            }
          }
          class Types extends StatelessWidget{ const Types({super.key}); @override Widget build(BuildContext context){ final types=['المصورين','قاعات الأعراس','الأوركسترات','الدقايقية و عيساوة','التريتور','النكافة']; return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackBg, iconTheme: const IconThemeData(color: Colors.white), title: const Text('اختار نوعك', style: TextStyle(color: Colors.white))), body: GridView.builder(padding: const EdgeInsets.all(14), gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount:2, childAspectRatio:1.2), itemCount: types.length, itemBuilder: (c,i){ return GestureDetector(onTap: ()=> Navigator.push(c, MaterialPageRoute(builder: (_)=> Register(type: types[i]))), child: Container(margin: const EdgeInsets.all(6), decoration: BoxDecoration(color: instaGrey, borderRadius: BorderRadius.circular(12)), child: Center(child: Text(types[i], style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold))))); })); } }
          class Register extends StatefulWidget{ final String type; const Register({super.key, required this.type}); @override State<Register> createState()=> _Re(); }
          class _Re extends State<Register>{
            final name=TextEditingController(); final user=TextEditingController(); final city=TextEditingController();
            XFile? vid; bool sent=false;
            Future<void> pick() async { final v=await ImagePicker().pickVideo(source: ImageSource.gallery); if(v!=null) setState(()=> vid=v); }
            @override Widget build(BuildContext context){
              if(sent){ return Scaffold(backgroundColor: blackBg, body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[const Icon(Icons.check, color: gold, size:60), Text('تم يا ${name.text}', style: const TextStyle(color: Colors.white, fontSize:18)), const SizedBox(height:10), ElevatedButton(onPressed: (){ Navigator.pushAndRemoveUntil(context, MaterialPageRoute(builder: (_)=> const Home(clientName: '', clientPhone: '')), (r)=> false); }, child: const Text('رجع للرئيسية'))]))); }
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackBg, iconTheme: const IconThemeData(color: Colors.white), title: Text(widget.type, style: const TextStyle(color: Colors.white))), body: Padding(padding: const EdgeInsets.all(16), child: Column(children:[
                TextField(controller: name, style: const TextStyle(color: Colors.white), decoration: InputDecoration(hintText: 'الاسم', filled: true, fillColor: instaGrey, border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none))),
                const SizedBox(height:10), TextField(controller: user, style: const TextStyle(color: Colors.white), decoration: InputDecoration(hintText: '@ المستخدم', filled: true, fillColor: instaGrey, border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none))),
                const SizedBox(height:10), TextField(controller: city, style: const TextStyle(color: Colors.white), decoration: InputDecoration(hintText: 'المدينة', filled: true, fillColor: instaGrey, border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none))),
                const SizedBox(height:10), GestureDetector(onTap: pick, child: Container(width: double.infinity, height:100, decoration: BoxDecoration(color: instaGrey, borderRadius: BorderRadius.circular(8)), child: Center(child: Text(vid==null? 'فيديو أولي' : '✅ ${vid!.name}', style: const TextStyle(color: Colors.white38))))),
                const Spacer(), SizedBox(width: double.infinity, height:48, child: ElevatedButton(onPressed: (){ if(name.text.isEmpty || user.text.isEmpty || vid==null) return; context.read<AppState>().addPending({'name':name.text.trim(),'user':user.text.trim(),'type':widget.type,'city':city.text.trim(),'bio':'${widget.type}','videos':[{'path':vid!.path,'title':vid!.name}], 'schedule':[]}); setState(()=> sent=true); }, style: ElevatedButton.styleFrom(backgroundColor: Colors.white, foregroundColor: Colors.black), child: const Text('صيفط طلب'))),
              ])));
            }
          }
          class FerqaLogin extends StatefulWidget{ const FerqaLogin({super.key}); @override State<FerqaLogin> createState()=> _FL(); }
          class _FL extends State<FerqaLogin>{ final user=TextEditingController(); @override Widget build(BuildContext context){ return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackBg, iconTheme: const IconThemeData(color: Colors.white), title: const Text('صفحتي', style: TextStyle(color: Colors.white, fontSize:12))), body: Padding(padding: const EdgeInsets.all(20), child: Column(children:[const SizedBox(height:20), TextField(controller: user, style: const TextStyle(color: Colors.white), decoration: InputDecoration(hintText: '@ المستخدم', filled: true, fillColor: instaGrey, border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none))), const SizedBox(height:20), SizedBox(width: double.infinity, height:48, child: ElevatedButton(onPressed: () async { if(user.text.trim().isEmpty) return; final pref=await SharedPreferences.getInstance(); await pref.setString('ferqa', user.text.trim()); if(!mounted) return; Navigator.pushAndRemoveUntil(context, MaterialPageRoute(builder: (_)=> FerqaPage(user: user.text.trim())), (r)=> false); }, style: ElevatedButton.styleFrom(backgroundColor: Colors.white, foregroundColor: Colors.black), child: const Text('دخول - وتبقى داخل')))]))); } }
          class FerqaPage extends StatefulWidget{ final String user; const FerqaPage({super.key, required this.user}); @override State<FerqaPage> createState()=> _FP(); }
          class _FP extends State<FerqaPage> with SingleTickerProviderStateMixin{
            late TabController tab; @override void initState(){ super.initState(); tab=TabController(length:3, vsync:this); }
            Future<void> addVideo() async { final picker=ImagePicker(); final v=await picker.pickVideo(source: ImageSource.gallery); if(v!=null){ context.read<AppState>().addVideo(widget.user, {'path': v.path, 'title': v.name}); } }
            Future<void> addSchedule() async { final date=TextEditingController(); final status=TextEditingController(); showDialog(context: context, builder: (ctx)=> AlertDialog(backgroundColor: blackCard, title: const Text('عمر جدولك', style: TextStyle(color: Colors.white, fontSize:12)), content: Column(mainAxisSize: MainAxisSize.min, children:[TextField(controller: date, style: const TextStyle(color: Colors.white), decoration: const InputDecoration(hintText: '2026-12-20')), TextField(controller: status, style: const TextStyle(color: Colors.white), decoration: const InputDecoration(hintText: 'خاوي/عامر'))]), actions:[ElevatedButton(onPressed: (){ if(date.text.isEmpty) return; context.read<AppState>().addSchedule(widget.user, {'date': date.text.trim(), 'status': status.text.trim().isEmpty? 'خاوي' : status.text.trim()}); Navigator.pop(ctx); }, child: const Text('إضافة'))])); }
            @override Widget build(BuildContext context){
              final st=context.watch<AppState>(); final idx=st.getIdx(widget.user);
              if(idx==-1){ return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackBg, title: Text('@${widget.user}', style: const TextStyle(color: Colors.white))), body: const Center(child: Text('ما كاينش - خاصك تكون مقبول', style: TextStyle(color: Colors.white54)))); }
              final ferqa=st.approved[idx]; final videos=ferqa['videos'] as List; final sched=ferqa['schedule'] as List? ?? [];
              return Scaffold(backgroundColor: blackBg, appBar: AppBar(backgroundColor: blackBg, title: Text(ferqa['user'], style: const TextStyle(color: Colors.white)), actions: [IconButton(icon: const Icon(Icons.logout, color: Colors.white38), onPressed: () async { final p=await SharedPreferences.getInstance(); await p.clear(); if(!mounted) return; Navigator.pushAndRemoveUntil(context, MaterialPageRoute(builder: (_)=> const Home(clientName: '', clientPhone: '')), (r)=> false); })], bottom: TabBar(controller: tab, labelColor: Colors.white, tabs: [Tab(text:'فيديوات ${videos.length}'), Tab(text:'جدولي ${sched.length}'), const Tab(text:'شكون شدني')])),
                body: TabBarView(controller: tab, children:[
                  Column(children:[Padding(padding: const EdgeInsets.all(12), child: Row(children:[Expanded(child: ElevatedButton.icon(onPressed: addVideo, icon: const Icon(Icons.videocam, size:16), label: const Text('لوح فيديو +', style: TextStyle(fontSize:11)), style: ElevatedButton.styleFrom(backgroundColor: Colors.white, foregroundColor: Colors.black))), const SizedBox(width:6), Expanded(child: ElevatedButton.icon(onPressed: addSchedule, icon: const Icon(Icons.calendar_today, size:14), label: const Text('زيد موعد +', style: TextStyle(fontSize:11)), style: ElevatedButton.styleFrom(backgroundColor: gold, foregroundColor: Colors.black)))])), const Divider(color: instaGrey), Expanded(child: videos.isEmpty? const Center(child: Text('لوح شحال ما بغيتي', style: TextStyle(color: Colors.white24))) : GridView.builder(padding: const EdgeInsets.all(1), gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount:3, crossAxisSpacing:1, mainAxisSpacing:1), itemCount: videos.length, itemBuilder: (c,i){ return Container(color: blackCard, child: const Icon(Icons.play_circle_outline, color: Colors.white38)); }))]),
                  Column(children:[Expanded(child: sched.isEmpty? const Center(child: Text('عمر جدولك لراسك', style: TextStyle(color: Colors.white24))) : ListView.builder(padding: const EdgeInsets.all(8), itemCount: sched.length, itemBuilder: (c,i){ final s=sched[i]; return Container(margin: const EdgeInsets.only(bottom:6), padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: instaGrey, borderRadius: BorderRadius.circular(8)), child: Row(children:[Expanded(child: Text('${s['date']} - ${s['status']}', style: const TextStyle(color: Colors.white))), IconButton(icon: const Icon(Icons.delete, color: Colors.white24, size:18), onPressed: (){ context.read<AppState>().delSchedule(widget.user, i); })])); }))]),
                  const Center(child: Text('شكون شدني', style: TextStyle(color: Colors.white24))),
                ]),
              );
            }
          }
          class LoginAdmin extends StatefulWidget{ const LoginAdmin({super.key}); @override State<LoginAdmin> createState()=> _LA(); }
