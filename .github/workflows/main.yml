name: Build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0
          channel: stable
          cache: true

      - name: Restore main.dart
        run: |
          cp lib/main.dart /tmp/main.dart || echo "no main"
          if [ ! -d "android" ]; then flutter create .; fi
          mkdir -p lib
          cp /tmp/main.dart lib/main.dart
          echo "name: hafalati
          description: HAFALATI
          publish_to: none
          version: 10.0.0+100
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            provider: ^6.1.1
            url_launcher: ^6.2.4
            shared_preferences: ^2.2.2
            image_picker: ^1.0.7
            cupertino_icons: ^1.0.6
          flutter:
            uses-material-design: true" > pubspec.yaml

      - name: Build
        run: |
          flutter pub get
          flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAFALATI-FIXED
          path: build/app/outputs/flutter-apk/app-release.apk
