name: HAFALATI Auto Builder
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Full Project Auto
        run: |
          flutter create . --org com.hafalati.app --project-name hafalati --platforms android
          
          cat > pubspec.yaml << 'EOF'
          name: hafalati
          description: HAFALATI - Wedding Market
          publish_to: 'none'
          version: 2.26.39+80
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            connectivity_plus: ^5.0.2
            cupertino_icons: ^1.0.6
          flutter:
            uses-material-design: true
          EOF

          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:connectivity_plus/connectivity_plus.dart';
          void main() => runApp(const HafalatiApp());
          class HafalatiApp extends StatelessWidget {
            const HafalatiApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(debugShowCheckedModeBanner: false, title: 'HAFALATI', theme: ThemeData(primarySwatch: Colors.pink, useMaterial3: true), home: const HomeScreen());
            }
          }
          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }
          class _HomeScreenState extends State<HomeScreen> {
            bool isOnline = true;
            @override
            void initState() {
              super.initState();
              Connectivity().checkConnectivity().then((r) { setState(() => isOnline = r != ConnectivityResult.none); });
              Connectivity().onConnectivityChanged.listen((r) { setState(() => isOnline = r != ConnectivityResult.none); });
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('HAFALATI - حفلاتي'), backgroundColor: Colors.pink, foregroundColor: Colors.white, actions: [Icon(isOnline ? Icons.wifi : Icons.wifi_off), const SizedBox(width: 16)]),
                body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Icon(isOnline ? Icons.check_circle : Icons.cloud_off, size: 100, color: isOnline ? Colors.green : Colors.grey), const SizedBox(height: 20), Text(isOnline ? 'متصل - Wifi خدام!' : 'غير متصل', style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold)), const SizedBox(height: 20), const Text('سوق الأعراس\nقاعات + فرق موسيقية', textAlign: TextAlign.center, style: TextStyle(fontSize: 18)), const SizedBox(height: 30), ElevatedButton(onPressed: () {}, style: ElevatedButton.styleFrom(backgroundColor: Colors.pink, padding: const EdgeInsets.symmetric(horizontal: 40, vertical: 15)), child: const Text('دخول السوق', style: TextStyle(color: Colors.white, fontSize: 18)))])),
              );
            }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hafalati-apk
          path: build/app/outputs/flutter-apk/app-release.apk
